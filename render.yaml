# ====================================================================
# AGRI-SWAP Render Blueprint Specification
# Deploys Backend API + ML Inference Engine (PyTorch, TensorFlow, DuckDB)
# ====================================================================

services:
  - type: web
    name: agri-swap-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: pip install -r requirements.txt && npm install && python scripts/download_model.py
    startCommand: node Backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PYTHON_CMD
        value: python3
      - key: PYTHONPATH
        value: .
      - key: PYTHONIOENCODING
        value: utf-8
      - key: TF_ENABLE_ONEDNN_OPTS
        value: "0"
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: CORS_ORIGIN
        value: "*"
